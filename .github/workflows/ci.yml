name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  # Filesystem binary cache: a cold run builds curl/OpenSSL/SQLite/spdlog once, later runs extract
  # archives instead. Steps key this directory on the pinned registry baseline plus the manifest.
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

jobs:
  policy:
    name: Dependency licence policy (GPL denylist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifests for GPL/AGPL dependencies
        run: python3 scripts/check_dependencies.py

  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # actions/checkout clones a foreign repository with depth 1, so `vcpkg` holds a single
      # commit (the tip of master) while vcpkg.json pins `builtin-baseline` to an older one.
      # vcpkg needs the pinned commit's tree to read versions/baseline.json; without it, install
      # fails with "failed to `git show` versions/baseline.json". The next step fetches exactly
      # that commit (cheaper than a full vcpkg clone) and publishes its SHA for the cache key.
      - name: Check out vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - name: Fetch pinned vcpkg baseline
        id: vcpkg-baseline
        run: py scripts/fetch_vcpkg_baseline.py

      - name: Bootstrap vcpkg
        shell: cmd
        run: vcpkg\bootstrap-vcpkg.bat -disableMetrics

      # Keyed by runner + baseline + manifest: archives built against a different baseline must
      # not be restored, or a baseline bump silently reuses stale packages.
      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-${{ steps.vcpkg-baseline.outputs.baseline }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-${{ steps.vcpkg-baseline.outputs.baseline }}-

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/windows-x64/_deps
          key: deps-windows-${{ hashFiles('tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset windows-x64

      - name: Test
        run: ctest --preset windows-x64

      - name: Smoke test CLI
        run: ./build/windows-x64/cli/flowget-cli.exe --version

  linux:
    name: Linux x64 (Clang, ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang clang-tidy-18 curl zip unzip tar
          # Named explicitly so a missing generator fails here with a clear message instead of
          # surfacing as "CMAKE_MAKE_PROGRAM is not set" inside a later configure step.
          ninja --version

      # Depth-1 clone: fetch the pinned baseline commit, same as the Windows job. See the comment
      # there for the failure this prevents.
      - name: Check out vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - name: Fetch pinned vcpkg baseline
        id: vcpkg-baseline
        run: python3 scripts/fetch_vcpkg_baseline.py

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-${{ steps.vcpkg-baseline.outputs.baseline }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-linux-${{ steps.vcpkg-baseline.outputs.baseline }}-

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/linux-x64/_deps
            build/linux-x64-asan/_deps
          key: deps-linux-${{ hashFiles('tests/CMakeLists.txt') }}

      - name: Configure (debug)
        run: cmake --preset linux-x64

      - name: Build (debug)
        run: cmake --build --preset linux-x64

      - name: Test (debug)
        run: ctest --preset linux-x64

      - name: Configure (sanitizers)
        run: cmake --preset linux-x64-asan

      - name: Build (sanitizers)
        run: cmake --build --preset linux-x64-asan

      - name: Test (sanitizers)
        run: ctest --preset linux-x64-asan

      - name: pre-commit (clang-format + hygiene, pinned versions)
        run: pipx run pre-commit run --all-files --show-diff-on-failure

      # Advisory until M1/S8: findings are compared against scripts/clang_tidy_baseline.txt, so new
      # code cannot silently add findings while the check itself stays non-blocking. The file list
      # comes from compile_commands.json, so this Linux job never asks for Windows-only sources.
      - name: clang-tidy (advisory, baseline gate)
        continue-on-error: true
        run: |
          clang-tidy-18 --version
          python3 scripts/clang_tidy.py --build-dir build/linux-x64
